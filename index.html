<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#141414;--mute:#6b6b6b;--line:#e4e4e0;--accent:#d7261e;--chip:#ececE8}
@media (prefers-color-scheme:dark){:root{--bg:#111;--card:#1b1b1b;--ink:#f1f1f1;--mute:#9a9a9a;--line:#2a2a2a;--chip:#232323}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
header{padding:32px 20px 12px;max-width:1400px;margin:0 auto}
h1{margin:0;font-size:26px;letter-spacing:-.01em}
h1 b{color:var(--accent)}
.sub{color:var(--mute);margin-top:4px}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .in{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
nav a{flex:none;padding:6px 12px;border-radius:999px;background:var(--chip);color:var(--ink);text-decoration:none;font-size:14px;white-space:nowrap}
nav a.on{background:var(--ink);color:var(--bg)}
nav a span{color:var(--mute);margin-left:4px;font-size:12px}
nav a.on span{color:inherit;opacity:.7}
main{max-width:1400px;margin:0 auto;padding:8px 20px 60px}
section{padding-top:28px;scroll-margin-top:56px}
.sh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sh h2{margin:0;font-size:20px}
.sh .n{color:var(--mute)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.filters a{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-size:14px}
.filters a:hover,.filters a:focus-visible{border-color:var(--ink)}
.filters a[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:zoom-in;display:flex;flex-direction:column}
.card[hidden]{display:none}
.card .im{aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center}
.card img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.card .meta{padding:8px 10px;font-size:12px;border-top:1px solid var(--line)}
.card .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dm{color:var(--mute)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;z-index:20}
#lb.show{display:flex}
#lb .top{display:flex;gap:8px;align-items:center;padding:12px 16px;color:#fff;flex-wrap:wrap}
#lb .top .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lb .top .btn{background:#222;color:#fff;border-color:#444;text-decoration:none}
#lb .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 16px 16px}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain;background:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
#toast.show{opacity:1}
@media (max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}header{padding:20px 16px 8px}main,nav .in{padding-left:16px;padding-right:16px}}
</style>
</head>

const RAW = "https://raw.githubusercontent.com/Yonge6/onelaser-product-images/main/";

    const options = new Map();
    for (const model of [null, ...g.modelFilters]) {

      link.href = model === null ? "#" + g.slug : `#${g.slug}-${model}`;
      link.textContent = model === null ? "全部" : g.slug === "hydra-gen2" ? `Hydra ${model} Gen2` : `Cobra ${model}`;
      if (model !== null) modelRoutes.set(link.hash, {slug: g.slug, model});
      options.set(model, link);
      filters.appendChild(link);
    }
    sec.insertBefore(filters, grid);
    modelGroups.set(g.slug, {sec, options, cards});
  }

    const c = document.createElement("div"); c.className = "card";
    const i = flat.push({...it, group: g.title, slug: g.slug, card: c}) - 1;

});
let selectedModel;
function applyModelFilter() {
  selectedModel = modelRoutes.get(location.hash);

    for (const [value, link] of options) {

const toast = m => { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1400); };

function step(offset) {
