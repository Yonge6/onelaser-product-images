<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneLaser Product Images</title>

<style>
:root{
  --bg:#f5f5f3;--card:#ffffff;--ink:#121212;--mute:#737373;--line:#e3e3df;--chip:#ebebe7;
  --accent:#e7310e;--photo:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f0f;--card:#191919;--ink:#f2f2f2;--mute:#8f8f8f;--line:#2a2a2a;--chip:#232323;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f0f0f;--card:#191919;--ink:#f2f2f2;--mute:#8f8f8f;--line:#2a2a2a;--chip:#232323;--shadow:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
.brand{display:flex;align-items:center;text-decoration:none}
.brand img{height:22px;width:auto;display:block}
.brand .on-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .on-light{display:none}:root:not([data-theme="light"]) .brand .on-dark{display:block}}
:root[data-theme="dark"] .brand .on-light{display:none}
:root[data-theme="dark"] .brand .on-dark{display:block}
.tools{display:flex;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--mute)}
.lang button.on{background:var(--ink);color:var(--bg)}
.hero{padding-top:26px;padding-bottom:28px}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--mute);max-width:660px}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stats b{display:block;font-size:22px;letter-spacing:-.01em}
.stats span{color:var(--mute);font-size:13px}
.hero .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn svg{width:15px;height:15px;flex:none}

.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:8px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mc:hover{transform:translateY(-2px);border-color:var(--ink)}
.mc .cv{aspect-ratio:16/10;background:var(--photo);display:flex;align-items:center;justify-content:center;padding:10px}
.mc .cv img{max-width:100%;max-height:100%;object-fit:contain}
.mc .tx{padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line)}
.mc .tx b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .tx span{color:var(--mute);font-size:12px;white-space:nowrap}

.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.tabs{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:6px 12px;border-radius:999px;background:var(--chip);text-decoration:none;font-size:13px;white-space:nowrap}
.tabs a span{color:var(--mute);margin-left:4px;font-size:12px}
.tabs a.on{background:var(--ink);color:var(--bg)}
.tabs a.on span{color:inherit;opacity:.65}
.search{position:relative;flex:none}
.search input{width:210px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 10px 7px 30px;font:inherit;font-size:13px;outline:none}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);padding:6px 9px;cursor:pointer;display:grid;place-items:center;color:var(--mute)}
.seg button.on{background:var(--chip);color:var(--ink)}
.seg svg{width:15px;height:15px}

main{padding-bottom:80px}
section{padding-top:36px;scroll-margin-top:60px}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sh h2{margin:0;font-size:22px;letter-spacing:-.01em}
.sh .n{color:var(--mute);font-size:14px;margin-right:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.filters a{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none;font-size:13px}
.filters a:hover{border-color:var(--ink)}
.filters a[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--col,220px),1fr));gap:12px}
body.dense .grid{--col:150px;gap:8px}
body.dense .card .meta{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;display:flex;flex-direction:column;transition:border-color .15s,transform .15s;padding:0;text-align:left}
.card:hover{border-color:var(--ink);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .im{aspect-ratio:4/3;background:var(--photo);display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%}
.card img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .3s}
.card img.ok{opacity:1}
.card .meta{padding:8px 10px;font-size:12px;border-top:1px solid var(--line);width:100%}
.card .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.card .dm{color:var(--mute)}
.empty{color:var(--mute);padding:40px 0;text-align:center}
footer{color:var(--mute);font-size:12px;padding:24px 0 40px;border-top:1px solid var(--line);word-break:break-all}

#lb{position:fixed;inset:0;background:rgba(10,10,10,.94);display:none;flex-direction:column;z-index:50;color:#fff}
#lb.show{display:flex}
#lb .lt{display:flex;gap:8px;align-items:center;padding:12px 16px;flex-wrap:wrap}
#lb .t{flex:1;min-width:180px}
#lb .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lb .t span{font-size:12px;color:#aaa}
#lb .btn{background:#1e1e1e;border-color:#3a3a3a;color:#fff}
#lb .btn:hover{border-color:#fff}
#lb .btn.pri{background:var(--accent);border-color:var(--accent)}
#lb .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 64px 20px;touch-action:pan-y}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:4px;user-select:none;-webkit-user-drag:none}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid #3a3a3a;background:#1e1e1e;color:#fff;cursor:pointer;font-size:22px;line-height:1}
#lb .nav:hover{border-color:#fff}
#lb .prev{left:12px}#lb .next{right:12px}
#lb .spin{position:absolute;width:28px;height:28px;border:3px solid #444;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:none}
#lb.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:#1e1e1e;border:1px solid #3a3a3a;border-radius:10px;padding:4px;display:none;min-width:180px;z-index:2}
.menu.open .pop{display:block}
.menu .pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:#fff}
.menu .pop button:hover{background:#2c2c2c}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  .wrap{padding:0 16px}
  .hero{padding-top:20px;padding-bottom:20px}
  .stats{gap:20px}
  .bar .wrap{flex-wrap:wrap;gap:8px}
  .tabs{order:3;flex-basis:100%}
  .search{flex:1}.search input{width:100%}
  .grid{--col:150px;gap:8px}
  body.dense .grid{--col:100px;gap:6px}
  .ov{grid-template-columns:repeat(2,1fr);gap:8px}
  #lb .stage{padding:0 8px 12px}
  #lb .nav{display:none}
  #lb .t{flex-basis:100%;order:-1}
}
</style>
</head>

  const it = flat[cur], u = url(it.file);
  copy({ url: u, md: `![${it.label}](${u})`, html: `<img src="${u}" alt="${it.label.replace(/"/g, "&quot;")}" width="${it.w}" height="${it.h}">`,
         page: location.origin + location.pathname + (lang === "en" ? "?lang=en" : "") + "#img=" + base(it.file) }[b.dataset.f]);
  $("#cm").classList.remove("open");
});
addEventListener("click", e => { if (!e.target.closest("#cm")) $("#cm").classList.remove("open"); });
addEventListener("keydown", e => {
  if (lb.classList.contains("show")) { if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1); }
  else if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
let tx = null; const st = $("#stage");
st.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
st.addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); tx = null; });

/* ---------- active tab ---------- */
const links = [...document.querySelectorAll("#tabs a")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  links.forEach(a => a.classList.toggle("on", a.dataset.s === e.target.id));
  const a = links.find(a => a.dataset.s === e.target.id);
  if (a) { const tb = $("#tabs"); tb.scrollTo({ left: a.offsetLeft - tb.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" }); }
}), { rootMargin: "-70px 0px -70% 0px" });
document.querySelectorAll("section").forEach(s => io.observe(s));

/* ---------- init ---------- */
applyLang();
route();
const im = location.hash.match(/^#img=(.+)$/);
if (im) { const i = flat.findIndex(f => base(f.file) === decodeURIComponent(im[1])); if (i >= 0) { flat[i].card.scrollIntoView({ block: "center" }); open(i); } }
</script>
</body>
