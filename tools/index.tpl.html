<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneLaser Product Images</title>
<meta name="description" content="OneLaser product image library, grouped by machine · OneLaser 全系列产品原图库，按机型分类">
<meta property="og:title" content="OneLaser Product Images">
<meta property="og:description" content="OneLaser product image library · 产品原图库">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d7261e'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>1</text></svg>">
<style>
:root{
  --bg:#f5f5f3;--card:#ffffff;--ink:#121212;--mute:#737373;--line:#e3e3df;--chip:#ebebe7;
  --accent:#d7261e;--photo:#ffffff;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0f0f;--card:#191919;--ink:#f2f2f2;--mute:#8f8f8f;--line:#2a2a2a;--chip:#232323;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f0f0f;--card:#191919;--ink:#f2f2f2;--mute:#8f8f8f;--line:#2a2a2a;--chip:#232323;--shadow:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1440px;margin:0 auto;padding:0 24px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em}
.brand i{width:26px;height:26px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
.tools{display:flex;gap:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:none;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--mute)}
.lang button.on{background:var(--ink);color:var(--bg)}
.hero{padding-top:26px;padding-bottom:28px}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.1;margin:0 0 10px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--mute);max-width:660px}
.stats{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}
.stats b{display:block;font-size:22px;letter-spacing:-.01em}
.stats span{color:var(--mute);font-size:13px}
.hero .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap;transition:border-color .15s}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn svg{width:15px;height:15px;flex:none}

.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:8px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mc:hover{transform:translateY(-2px);border-color:var(--ink)}
.mc .cv{aspect-ratio:16/10;background:var(--photo);display:flex;align-items:center;justify-content:center;padding:10px}
.mc .cv img{max-width:100%;max-height:100%;object-fit:contain}
.mc .tx{padding:10px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line)}
.mc .tx b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc .tx span{color:var(--mute);font-size:12px;white-space:nowrap}

.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.tabs{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:6px 12px;border-radius:999px;background:var(--chip);text-decoration:none;font-size:13px;white-space:nowrap}
.tabs a span{color:var(--mute);margin-left:4px;font-size:12px}
.tabs a.on{background:var(--ink);color:var(--bg)}
.tabs a.on span{color:inherit;opacity:.65}
.search{position:relative;flex:none}
.search input{width:210px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 10px 7px 30px;font:inherit;font-size:13px;outline:none}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--mute)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);padding:6px 9px;cursor:pointer;display:grid;place-items:center;color:var(--mute)}
.seg button.on{background:var(--chip);color:var(--ink)}
.seg svg{width:15px;height:15px}

main{padding-bottom:80px}
section{padding-top:36px;scroll-margin-top:60px}
.sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sh h2{margin:0;font-size:22px;letter-spacing:-.01em}
.sh .n{color:var(--mute);font-size:14px;margin-right:auto}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.filters a{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);text-decoration:none;font-size:13px}
.filters a:hover{border-color:var(--ink)}
.filters a[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--col,220px),1fr));gap:12px}
body.dense .grid{--col:150px;gap:8px}
body.dense .card .meta{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:zoom-in;display:flex;flex-direction:column;transition:border-color .15s,transform .15s;padding:0;text-align:left}
.card:hover{border-color:var(--ink);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card .im{aspect-ratio:4/3;background:var(--photo);display:flex;align-items:center;justify-content:center;overflow:hidden;width:100%}
.card img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .3s}
.card img.ok{opacity:1}
.card .meta{padding:8px 10px;font-size:12px;border-top:1px solid var(--line);width:100%}
.card .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.card .dm{color:var(--mute)}
.empty{color:var(--mute);padding:40px 0;text-align:center}
footer{color:var(--mute);font-size:12px;padding:24px 0 40px;border-top:1px solid var(--line);word-break:break-all}

#lb{position:fixed;inset:0;background:rgba(10,10,10,.94);display:none;flex-direction:column;z-index:50;color:#fff}
#lb.show{display:flex}
#lb .lt{display:flex;gap:8px;align-items:center;padding:12px 16px;flex-wrap:wrap}
#lb .t{flex:1;min-width:180px}
#lb .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lb .t span{font-size:12px;color:#aaa}
#lb .btn{background:#1e1e1e;border-color:#3a3a3a;color:#fff}
#lb .btn:hover{border-color:#fff}
#lb .btn.pri{background:var(--accent);border-color:var(--accent)}
#lb .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:0 64px 20px;touch-action:pan-y}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:4px;user-select:none;-webkit-user-drag:none}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid #3a3a3a;background:#1e1e1e;color:#fff;cursor:pointer;font-size:22px;line-height:1}
#lb .nav:hover{border-color:#fff}
#lb .prev{left:12px}#lb .next{right:12px}
#lb .spin{position:absolute;width:28px;height:28px;border:3px solid #444;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:none}
#lb.loading .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.menu{position:relative}
.menu .pop{position:absolute;right:0;top:calc(100% + 6px);background:#1e1e1e;border:1px solid #3a3a3a;border-radius:10px;padding:4px;display:none;min-width:180px;z-index:2}
.menu.open .pop{display:block}
.menu .pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;color:#fff}
.menu .pop button:hover{background:#2c2c2c}

#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  .wrap{padding:0 16px}
  .hero{padding-top:20px;padding-bottom:20px}
  .stats{gap:20px}
  .bar .wrap{flex-wrap:wrap;gap:8px}
  .tabs{order:3;flex-basis:100%}
  .search{flex:1}.search input{width:100%}
  .grid{--col:150px;gap:8px}
  body.dense .grid{--col:100px;gap:6px}
  .ov{grid-template-columns:repeat(2,1fr);gap:8px}
  #lb .stage{padding:0 8px 12px}
  #lb .nav{display:none}
  #lb .t{flex-basis:100%;order:-1}
}
</style>
</head>
<body>
<div class="wrap top">
  <div class="brand"><i>1</i>ONELASER</div>
  <div class="tools">
    <div class="lang" role="group" aria-label="Language"><button data-lang="zh">中文</button><button data-lang="en">EN</button></div>
    <button class="btn" id="theme" aria-label="Theme">◐</button>
  </div>
</div>
<div class="wrap hero">
  <h1 data-i="h1"></h1>
  <p data-i="intro"></p>
  <div class="stats" id="stats"></div>
  <div class="acts">
    <a class="btn pri" href="__ALLZIP__"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg><span data-i="allzip"></span></a>
    <a class="btn" href="https://github.com/Yonge6/onelaser-product-images" target="_blank" rel="noopener" data-i="repo"></a>
  </div>
</div>

<div class="wrap"><div class="ov" id="ov"></div></div>

<div class="bar">
  <div class="wrap">
    <div class="tabs" id="tabs"></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" autocomplete="off"></label>
    <div class="seg" role="group">
      <button id="big" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></button>
      <button id="small"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h4v4H3zM10 3h4v4h-4zM17 3h4v4h-4zM3 10h4v4H3zM10 10h4v4h-4zM17 10h4v4h-4zM3 17h4v4H3zM10 17h4v4h-4zM17 17h4v4h-4z"/></svg></button>
    </div>
  </div>
</div>

<main class="wrap" id="main"></main>
<p class="wrap empty" id="empty" hidden data-i="empty"></p>
<footer class="wrap"><span data-i="foot"></span> __DATE__ · raw.githubusercontent.com/Yonge6/onelaser-product-images/main/images/&lt;series&gt;/&lt;file&gt;</footer>

<div id="lb" aria-modal="true" role="dialog">
  <div class="lt">
    <div class="t"><b id="lbt"></b><span id="lbs"></span></div>
    <div class="menu" id="cm"><button class="btn" id="cmb"><span data-i="copy"></span> ▾</button>
      <div class="pop"><button data-f="url" data-i="cUrl"></button><button data-f="md">Markdown</button><button data-f="html">HTML &lt;img&gt;</button><button data-f="page" data-i="cPage"></button></div></div>
    <a class="btn pri" id="lbd" download data-i="download"></a>
    <button class="btn" id="lbx" aria-label="Close">✕</button>
  </div>
  <div class="stage" id="stage">
    <button class="nav prev" id="lbp" aria-label="Previous">‹</button>
    <img id="lbi" alt=""><div class="spin"></div>
    <button class="nav next" id="lbn" aria-label="Next">›</button>
  </div>
</div>
<div id="toast"></div>

<script>
const DATA = __DATA__;
const RAW = "__RAWBASE__";

/* ---------- i18n ---------- */
const T = {
  zh: {
    h1: "产品图库", intro: "OneLaser 全系列产品原图，按机型分类。点击图片查看大图，可复制直链（URL / Markdown / HTML）或下载原图；每个机型都可以整组打包下载。",
    imgs: "张原图", groups: "个分类", size: "原图总大小", allzip: "下载全部原图 ZIP · __ALLZIPMB__ MB", repo: "GitHub 仓库",
    search: "搜索图片名或型号…  按 / 快速搜索", empty: "没有匹配的图片", foot: "来源：Figma「OneLaser Products」+ KeyShot 渲染 · 更新于",
    n: n => `${n} 张`, copyGroup: "复制本组直链", copyModel: "复制当前型号直链", zip: "下载 ZIP", all: "全部",
    copy: "复制链接", cUrl: "图片直链 URL", cPage: "本图预览页链接", download: "下载原图", copied: "已复制", copiedN: n => `已复制 ${n} 条直链`,
    orig: "原名", big: "大图", small: "小图", theme: "切换深浅色",
    titles: { "all": "全系列", "logo-brand": "品牌 & Logo" },
  },
  en: {
    h1: "Product Image Library", intro: "Original OneLaser product images, grouped by machine. Click any image to view it full size, copy a direct link (URL / Markdown / HTML) or download the original. Each machine can also be downloaded as one ZIP.",
    imgs: "original images", groups: "categories", size: "total size", allzip: "Download all · ZIP __ALLZIPMB__ MB", repo: "GitHub repo",
    search: "Search name or model…  press / to focus", empty: "No matching images", foot: "Source: Figma “OneLaser Products” + KeyShot renders · Updated",
    n: n => `${n} images`, copyGroup: "Copy all links", copyModel: "Copy links for this model", zip: "Download ZIP", all: "All",
    copy: "Copy link", cUrl: "Direct image URL", cPage: "Link to this preview", download: "Download original", copied: "Copied", copiedN: n => `Copied ${n} links`,
    orig: "Original name", big: "Large", small: "Compact", theme: "Toggle theme",
    titles: { "all": "All Products", "logo-brand": "Logo & Brand" },
  },
};
const store = { get: k => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} } };
const qsLang = new URLSearchParams(location.search).get("lang");
let lang = ["zh", "en"].includes(qsLang) ? qsLang : store.get("lang") || ((navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en");
const t = k => T[lang][k];

/* ---------- helpers ---------- */
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const url = f => RAW + enc(f);
const $ = s => document.querySelector(s);
const fmt = kb => kb > 1024 ? (kb / 1024).toFixed(1) + " MB" : kb + " KB";
const base = f => f.split("/").pop().replace(/\.[^.]+$/, "");
const hasCJK = s => /[㐀-鿿]/.test(s);
const JUNK = /^(微信图片|image\b|\d+image|ChatGPT Image|Frame\b|Rectangle\b|分组|画板|quality_restoration|iwE[A-Za-z0-9]{20,}|[0-9a-f]{20,}|[0-9A-F]{8}-[0-9A-F]{4}|\d+(-\d+)?$|按新尺寸|[\w-]*Gemini_Generated|icon-\d)/i;
/* zh -> en terms, longest first */
const DICT = [
  ["教学实验室激光雕刻作品场景", " Education lab engraving scene"], ["仰角雕刻状态", "Low-angle engraving"], ["取下操作屏", "control panel removed"],
  ["门盖上升", "lid raised"], ["早期渲染", "Early render"], ["正面渲染", "Front render"], ["白底图", " white background"], ["场景图", " scene"],
  ["正右侧", "Front-right side"], ["侧后视", "Rear-side view"], ["正后视", "Rear view"], ["右俯视", "Right top view"], ["左俯视", "Left top view"],
  ["右侧视", "Right side view"], ["正右视", "Front-right view"], ["旧标", "old label "], ["系列", " series "], ["渲染", " render"],
  ["正视", "Front view"], ["后视", "Rear view"], ["右视", "Right view"], ["左视", "Left view"], ["右侧", "Right side"], ["左侧", "Left side"],
  ["后侧", "Rear side"], ["侧后", "Rear side"], ["俯视", "top view"], ["正面", "front"], ["上升", "raised"], ["下降", "lowered"],
  ["开盖", "Lid open"], ["带基座", " with base "], ["烟", " smoke"], ["总统日", "Presidents' Day "], ["（", " ("], ["）", ")"], ["，", ", "],
];
const toEn = s => DICT.reduce((a, [z, e]) => a.split(z).join(e), s).replace(/\s{2,}/g, " ").replace(/\s+([,)])/g, "$1").trim();
const groups = DATA.filter(g => g.items.length);
const gTitle = g => T[lang].titles[g.slug] || g.group;
const modelName = (g, m) => g.slug === "hydra-gen2" ? `Hydra ${m} Gen2` : g.slug === "cobra" ? `Cobra ${m}` : `${g.group} ${m}`;
/* tidy label from filename, e.g. hydra-gen2-7-003 -> "Hydra 7 Gen2 · 003" */
function autoLabel(g, it) {
  const num = (base(it.file).match(/(\d{3})$/) || [])[1] || "";
  const head = it.model != null ? modelName(g, it.model) : gTitle(g);
  return num ? `${head} · ${num}` : head;
}
function label(g, it) {
  let n = (it.name || "").replace(/\s*拷贝\s*$/, "").replace(/\s+\d$/, "").replace(/\s{2,}/g, " ").trim();
  if (!n || JUNK.test(n) || n.length > 40 || /jimeng/i.test(n)) return autoLabel(g, it);
  const head = it.model != null ? modelName(g, it.model) : gTitle(g);
  const angleOnly = /^[㐀-鿿\-－]+$/.test(n);           // e.g. 右侧-门盖上升 → needs the machine name
  if (lang === "en" && hasCJK(n)) {
    const en = toEn(n).replace(/\s*-\s*/g, " – ");
    if (hasCJK(en)) return autoLabel(g, it);
    return angleOnly ? `${head} · ${en}` : en;
  }
  return angleOnly ? `${head} · ${n}` : n;
}

/* ---------- build DOM ---------- */
const flat = [];
const modelRoutes = new Map(); // "#hydra-gen2-7" -> {slug, model}
groups.forEach(g => {
  $("#ov").insertAdjacentHTML("beforeend", `<a class="mc" href="#${g.slug}"><div class="cv"><img loading="lazy" src="${enc((g.items.find(i => i.w >= i.h) || g.items[0]).thumb)}" alt=""></div><div class="tx"><b data-g="${g.slug}"></b><span data-n="${g.items.length}"></span></div></a>`);
  $("#tabs").insertAdjacentHTML("beforeend", `<a href="#${g.slug}" data-s="${g.slug}"><b data-g="${g.slug}" style="font-weight:inherit"></b><span>${g.items.length}</span></a>`);

  const sec = document.createElement("section"); sec.id = g.slug;
  sec.innerHTML = `<div class="sh"><h2 data-g="${g.slug}"></h2><span class="n"><span data-n="${g.items.length}"></span> · ${fmt(g.items.reduce((a, i) => a + i.kb, 0))}</span>
    <button class="btn" data-copy="${g.slug}"></button>
    ${g.zip ? `<a class="btn" href="${g.zip}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg><span data-i="zip"></span> · ${g.zipmb} MB</a>` : ""}</div>`;
  if (g.modelFilters) {
    const f = document.createElement("div"); f.className = "filters"; f.role = "group";
    [null, ...g.modelFilters].forEach(m => {
      const a = document.createElement("a");
      a.href = m === null ? `#${g.slug}` : `#${g.slug}-${m}`;
      a.dataset.model = m === null ? "" : m;
      if (m === null) a.dataset.i = "all"; else { a.textContent = modelName(g, m); modelRoutes.set(a.hash, { slug: g.slug, model: m }); }
      f.appendChild(a);
    });
    sec.appendChild(f);
  }
  const grid = document.createElement("div"); grid.className = "grid"; sec.appendChild(grid);
  g.items.forEach(it => {
    const i = flat.push({ ...it, g }) - 1;
    const c = document.createElement("button"); c.className = "card"; c.dataset.i = i;
    c.innerHTML = `<div class="im"><img loading="lazy" decoding="async" src="${enc(it.thumb)}" alt=""></div><div class="meta"><div class="nm"></div><div class="dm">${it.w}×${it.h} · ${fmt(it.kb)}</div></div>`;
    const im = c.querySelector("img"); im.onload = () => im.classList.add("ok"); if (im.complete) im.classList.add("ok");
    c.onclick = () => open(i);
    flat[i].card = c;
    grid.appendChild(c);
  });
  $("#main").appendChild(sec);
});

/* ---------- apply language ---------- */
function applyLang() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i]").forEach(el => { const v = t(el.dataset.i); if (typeof v === "string") el.textContent = v; });
  document.querySelectorAll("[data-g]").forEach(el => el.textContent = gTitle(groups.find(g => g.slug === el.dataset.g)));
  document.querySelectorAll("[data-n]").forEach(el => el.textContent = t("n")(+el.dataset.n));
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  $("#q").placeholder = t("search");
  $("#big").title = t("big"); $("#small").title = t("small"); $("#theme").title = t("theme");
  const total = flat.length, mb = flat.reduce((a, i) => a + i.kb, 0) / 1024;
  $("#stats").innerHTML = `<div><b>${total}</b><span>${t("imgs")}</span></div><div><b>${groups.length}</b><span>${t("groups")}</span></div><div><b>${(mb / 1024).toFixed(2)} GB</b><span>${t("size")}</span></div>`;
  flat.forEach(it => {
    it.label = label(it.g, it);
    const nm = it.card.querySelector(".nm"); nm.textContent = it.label; nm.title = it.name;
    it.card.querySelector("img").alt = it.label;
    it.q = [it.label, it.name, gTitle(it.g), it.g.group, it.model != null ? modelName(it.g, it.model) : "", base(it.file)].join(" ").toLowerCase();
  });
  updateCopyLabels();
  if (cur >= 0) open(cur, false);
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang; store.set("lang", lang);
  const u = new URL(location.href); u.searchParams.delete("lang"); history.replaceState(null, "", u);
  applyLang();
});

/* ---------- filtering: model chips + search ---------- */
let selModel = null, query = "";
function applyFilters() {
  let any = false;
  groups.forEach(g => {
    const sec = document.getElementById(g.slug);
    const m = selModel && selModel.slug === g.slug ? selModel.model : null;
    sec.querySelectorAll(".filters a").forEach(a => a.setAttribute("aria-current", String((a.dataset.model === "" ? null : +a.dataset.model) === m)));
    let n = 0;
    flat.filter(it => it.g === g).forEach(it => {
      const show = (m === null || it.model === m) && (!query || it.q.includes(query));
      it.card.hidden = !show; if (show) n++;
    });
    sec.hidden = n === 0; if (n) any = true;
  });
  $("#empty").hidden = any;
  updateCopyLabels();
}
function updateCopyLabels() {
  document.querySelectorAll("[data-copy]").forEach(b => b.textContent = selModel && selModel.slug === b.dataset.copy ? t("copyModel") : t("copyGroup"));
}
function route() {
  selModel = modelRoutes.get(location.hash) || null;
  applyFilters();
  if (selModel) document.getElementById(selModel.slug).scrollIntoView();
}
addEventListener("hashchange", route);
$("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); applyFilters(); });

/* ---------- copy ---------- */
const toast = m => { const el = $("#toast"); el.textContent = m; el.classList.add("show"); clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove("show"), 1500); };
const copy = async (s, m) => { try { await navigator.clipboard.writeText(s); toast(m || t("copied")); } catch { prompt("", s); } };
document.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => {
  const list = flat.filter(it => it.g.slug === b.dataset.copy && !it.card.hidden);
  copy(list.map(it => url(it.file)).join("\n"), t("copiedN")(list.length));
});

/* ---------- density + theme ---------- */
const setDense = d => { document.body.classList.toggle("dense", d); $("#small").classList.toggle("on", d); $("#big").classList.toggle("on", !d); store.set("dense", d ? "1" : "0"); };
$("#big").onclick = () => setDense(false); $("#small").onclick = () => setDense(true);
if (store.get("dense") === "1") setDense(true);
const th = store.get("theme"); if (th) document.documentElement.dataset.theme = th;
$("#theme").onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark"; store.set("theme", r.dataset.theme);
};

/* ---------- lightbox ---------- */
let cur = -1; const lb = $("#lb"), lbi = $("#lbi");
const visible = () => flat.map((it, i) => i).filter(i => !flat[i].card.hidden);
function open(i, fresh = true) {
  cur = i; const it = flat[i], pos = visible(), j = pos.indexOf(i);
  lb.classList.add("show"); document.body.style.overflow = "hidden";
  if (fresh) {
    lb.classList.add("loading"); lbi.src = enc(it.thumb);
    const full = new Image(); full.onload = () => { if (cur === i) { lbi.src = full.src; lb.classList.remove("loading"); } }; full.src = url(it.file);
    [1, -1].forEach(s => { const n = pos[(j + s + pos.length) % pos.length]; if (n != null && n !== i) new Image().src = url(flat[n].file); });
    history.replaceState(null, "", "#img=" + base(it.file));
  }
  $("#lbt").textContent = it.label;
  $("#lbs").textContent = [gTitle(it.g), j >= 0 ? `${j + 1} / ${pos.length}` : "", `${it.w}×${it.h}`, fmt(it.kb), it.name && it.name !== it.label ? `${t("orig")}: ${it.name}` : ""].filter(Boolean).join(" · ");
  const d = $("#lbd"); d.href = url(it.file); d.setAttribute("download", it.file.split("/").pop());
}
function step(s) { const pos = visible(), j = pos.indexOf(cur); if (j >= 0) open(pos[(j + s + pos.length) % pos.length]); }
function close() {
  lb.classList.remove("show"); document.body.style.overflow = ""; $("#cm").classList.remove("open");
  if (cur >= 0) history.replaceState(null, "", selModel ? `#${selModel.slug}-${selModel.model}` : `#${flat[cur].g.slug}`);
  cur = -1;
}
$("#lbx").onclick = close;
$("#lbp").onclick = e => { e.stopPropagation(); step(-1); };
$("#lbn").onclick = e => { e.stopPropagation(); step(1); };
$("#stage").onclick = e => { if (e.target.id === "stage") close(); };
$("#cmb").onclick = e => { e.stopPropagation(); $("#cm").classList.toggle("open"); };
document.querySelectorAll("#cm .pop button").forEach(b => b.onclick = () => {
  const it = flat[cur], u = url(it.file);
  copy({ url: u, md: `![${it.label}](${u})`, html: `<img src="${u}" alt="${it.label.replace(/"/g, "&quot;")}" width="${it.w}" height="${it.h}">`,
         page: location.origin + location.pathname + (lang === "en" ? "?lang=en" : "") + "#img=" + base(it.file) }[b.dataset.f]);
  $("#cm").classList.remove("open");
});
addEventListener("click", e => { if (!e.target.closest("#cm")) $("#cm").classList.remove("open"); });
addEventListener("keydown", e => {
  if (lb.classList.contains("show")) { if (e.key === "Escape") close(); else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1); }
  else if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
});
let tx = null; const st = $("#stage");
st.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
st.addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); tx = null; });

/* ---------- active tab ---------- */
const links = [...document.querySelectorAll("#tabs a")];
const io = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  links.forEach(a => a.classList.toggle("on", a.dataset.s === e.target.id));
  const a = links.find(a => a.dataset.s === e.target.id);
  if (a) { const tb = $("#tabs"); tb.scrollTo({ left: a.offsetLeft - tb.clientWidth / 2 + a.clientWidth / 2, behavior: "smooth" }); }
}), { rootMargin: "-70px 0px -70% 0px" });
document.querySelectorAll("section").forEach(s => io.observe(s));

/* ---------- init ---------- */
applyLang();
route();
const im = location.hash.match(/^#img=(.+)$/);
if (im) { const i = flat.findIndex(f => base(f.file) === decodeURIComponent(im[1])); if (i >= 0) { flat[i].card.scrollIntoView({ block: "center" }); open(i); } }
</script>
</body>
</html>
